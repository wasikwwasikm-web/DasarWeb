<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas — SIMPUS-Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#6f42c1;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="anggota/list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <section class="card shadow-sm mx-auto" style="max-width: 32rem;">
            <div class="card-body p-4">
                <h1 class="card-title h2 mb-4" style="color:#6f42c1;">Login Petugas</h1>

                <form action="#" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" type="text" id="username" name="username" placeholder="Masukkan username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password" placeholder="Masukkan password" required>
                    </div>

                    <button class="btn w-100 text-white" style="background-color:#6f42c1;" type="submit">Masuk</button>
                </form>

                <p class="mt-3 mb-0">Belum punya akun? <a href="registrasi.html">Daftar di sini</a></p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
