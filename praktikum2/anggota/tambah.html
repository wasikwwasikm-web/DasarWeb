<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMPULS-Mini | Tambah Anggota</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <h1>SIMPULS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Anggota</h2>
            <form>
                <p>
                    <label for="nama">Nama:</label><br>
                    <input type="text" id="nama" name="nama_lengkap" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="no_anggota">N. Anggota:</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir:</label><br>
                    <input type="datetime-local" value="dd/mm/yyyy hh:mm:ss" id="tanggal_lahir" name="tanggal_lahir" required>
                </p>
                <p>
                    <label for="alamat">Alamat:</label><br>
                    <textarea id="alamat" rows="4" cols="30" name="alamat" required></textarea>
                </p>
                <p>
                    <label for="no_hp">No. HP:</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPULS-Mini &mdash; Jobsheet 1</p>
    </footer>
</body>
</html>
