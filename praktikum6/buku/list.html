<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <!-- Penambahan Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <!-- Menambah navbar Bootstrap untuk menggantikan checkbox hack. -->
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;"><div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
        <!-- [DIRUBAH] tombol navbar diberi id agar script toggle dapat berfungsi -->
        <button id="nav-toggle-btn" class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <nav class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li><li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li><li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li><li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li><li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul></nav>
    </div></header>

    <main class="container my-4"><section class="card shadow-sm mb-4"><div class="card-body">
        <h1 class="card-title h2" style="color:#1d5b8a;">Daftar Buku</h1>
        <div class="mb-3"><input type="text" id="search-Input" class="form-control" placeholder="Cari buku..."></div>
        <!-- Muat Ulang indicator -->
        <button type="button" id="btn-muat-ulang" style="margin-bottom:10px;">
            🔄 Muat Ulang
        </button>
        <!-- Loading indicator -->
        <p id="loading-indicator" style="display:none;">Memuat data...</p>
        <div class="mb-3 text-muted small" id="table-counter">Menampilkan 5 dari 5 buku</div>
        <div class="table-responsive"><table class="table table-striped table-hover align-middle" data-label="buku">
            <thead style="background-color:#1d5b8a;"><tr class="text-white"><th>Judul</th><th>Pengarang</th><th>Tahun</th><th>Stok</th><th>Aksi</th></tr></thead>
            <tbody>
                <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
            </tbody>
        </table></div>
    </div></section></main>

    <footer><p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
